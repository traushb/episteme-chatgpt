name: iOS unsigned IPA

# Builds an unsigned Episteme .ipa on a hosted Mac, for sideloading with a
# re-signing tool (Sideloadly, AltStore, SideStore). The native inputs that
# are not in the repository are fetched from their upstream sources: PDFium
# from bblanchon/pdfium-binaries (the build scripts expect that layout), and
# libarchive/xz from their own repositories.
#
# The app binary keeps its symbol table and the dSYMs are uploaded next to the
# IPA, so device crash reports (.ips) can be read. Dispatching this workflow
# with symbolicate_run_id and crash_offsets maps the "imageOffset" values of
# Reader frames in such a report to functions, using that build's symbols.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode build configuration
        type: choice
        options: [Release, Debug]
        default: Release
      symbolicate_run_id:
        description: Instead of building, symbolicate a crash from the IPA built by this run ID
        default: ""
      crash_offsets:
        description: Space-separated imageOffset values of Reader frames in the .ips report
        default: ""
  push:
    branches:
      - claude/chatgpt-answer-analysis-ios-evrpz8

concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}${{ inputs.symbolicate_run_id && '-symbolicate' || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  # Downloading the symbols of an earlier run.
  actions: read

jobs:
  ipa:
    if: ${{ !inputs.symbolicate_run_id }}
    # Intel runners have 14 GB of RAM (Apple Silicon ones 7 GB); the
    # Kotlin/Native release link of the shared module needs the headroom.
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
      PDFIUM_TAG: chromium/8066
      LIBARCHIVE_TAG: v3.8.1
      XZ_TAG: v5.8.1
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          # The Gradle native-library tasks pin DEVELOPER_DIR to /Applications/Xcode.app.
          if [ -L /Applications/Xcode.app ] || [ ! -e /Applications/Xcode.app ]; then
            sudo ln -sfn "$XCODE" /Applications/Xcode.app
          fi
          xcodebuild -version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The macOS image ships an Android SDK; use its sdkmanager directly.
      - name: Android SDK packages (Gradle Android plugin, CMake for libarchive)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.31.6"
          ls "$SDK/cmake"

      - name: Configure Gradle
        run: |
          cat >> gradle.properties <<'EOF'
          kotlin.mpp.applyDefaultHierarchyTemplate=false
          kotlin.daemon.jvmargs=-Xmx6g -XX:+UseG1GC -Dfile.encoding=UTF-8
          org.gradle.workers.max=3
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          # This workflow only runs on a feature branch; let it keep its cache.
          cache-read-only: false

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Fetch PDFium, libarchive and xz
        run: |
          set -euo pipefail
          for variant in ios-device-arm64 ios-simulator-arm64; do
            mkdir -p "third_party/pdfium/$variant"
            curl -fsSL "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG//\//%2F}/pdfium-$variant.tgz" \
              | tar -xz -C "third_party/pdfium/$variant"
            ls "third_party/pdfium/$variant" "third_party/pdfium/$variant/lib"
          done
          git clone --quiet --depth 1 --branch "$LIBARCHIVE_TAG" https://github.com/libarchive/libarchive.git third_party/libarchive
          git clone --quiet --depth 1 --branch "$XZ_TAG" https://github.com/tukaani-project/xz.git third_party/xz

      - name: Build PDFium.xcframework
        run: |
          set -euo pipefail
          # The Xcode validation phase requires the framework plist to state the
          # binary's own minimum OS, so take it from the downloaded dylib.
          MINOS="$(otool -l third_party/pdfium/ios-device-arm64/lib/libpdfium.dylib | awk '/minos/ {print $2; exit}')"
          echo "PDFium minimum iOS: $MINOS"
          sed -i '' "s/^MINIMUM_OS=.*/MINIMUM_OS=\"$MINOS\"/" scripts/ios/create-pdfium-xcframework.sh
          sh scripts/ios/create-pdfium-xcframework.sh

      - name: Skip the Crashlytics dSYM upload (no Firebase config here)
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          project = Path("iosApp/Reader.xcodeproj/project.pbxproj")
          text = project.read_text()
          phase = 'shellScript = "\\"${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run\\"\\n";'
          assert phase in text, "Crashlytics run-script phase not found"
          project.write_text(text.replace(phase, 'shellScript = "echo Crashlytics upload skipped\\n";'))
          EOF

      - name: Build the app without code signing
        run: |
          set -o pipefail
          mkdir -p build
          if ! xcodebuild \
              -project iosApp/Reader.xcodeproj \
              -scheme Reader \
              -configuration "$CONFIGURATION" \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/ios-derived \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS="" \
              DEVELOPMENT_TEAM="" \
              STRIP_INSTALLED_PRODUCT=NO \
              build > build/xcodebuild.log 2>&1; then
            echo "::group::Errors"
            grep -n -E "error:|^e: |FAILURE:|What went wrong|Exception|\*\* BUILD FAILED" build/xcodebuild.log | head -n 200 || true
            echo "::endgroup::"
            tail -n 250 build/xcodebuild.log
            exit 1
          fi
          tail -n 20 build/xcodebuild.log

      - name: Package the IPA
        run: |
          set -euo pipefail
          APP="$(find "build/ios-derived/Build/Products/${CONFIGURATION}-iphoneos" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          echo "App bundle: $APP"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry "../Episteme-ChatGPT-unsigned.ipa" Payload)
          ls -lh build/Episteme-ChatGPT-unsigned.ipa

      - name: Collect debug symbols
        run: |
          set -euo pipefail
          PRODUCTS="build/ios-derived/Build/Products/${CONFIGURATION}-iphoneos"
          # Matches "slice_uuid" in the crash reports of this build.
          dwarfdump --uuid "$PRODUCTS/Reader.app/Reader"
          (cd "$PRODUCTS" && zip -qry "$GITHUB_WORKSPACE/build/Episteme-ChatGPT-dSYMs.zip" ./*.dSYM) \
            || echo "No dSYMs were produced"

      - uses: actions/upload-artifact@v4
        with:
          name: Episteme-ChatGPT-unsigned-ipa
          path: build/Episteme-ChatGPT-unsigned.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: Episteme-ChatGPT-dSYMs
          path: build/Episteme-ChatGPT-dSYMs.zip
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 7

  symbolicate:
    if: ${{ inputs.symbolicate_run_id }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.symbolicate_run_id }}
          github-token: ${{ github.token }}
          path: artifacts

      - name: Symbolicate Reader frames
        env:
          OFFSETS: ${{ inputs.crash_offsets }}
        run: |
          set -euo pipefail
          IPA="$(find artifacts -name '*.ipa' | head -n 1)"
          unzip -q -o "$IPA" 'Payload/Reader.app/Reader' -d app
          TARGETS="app/Payload/Reader.app/Reader"
          DSYMS="$(find artifacts -name '*dSYMs.zip' | head -n 1)"
          if [ -n "$DSYMS" ]; then
            unzip -q -o "$DSYMS" -d dsyms
            DWARF="dsyms/Reader.app.dSYM/Contents/Resources/DWARF/Reader"
            # The dSYM adds file and line; the binary's own symbol table also
            # covers code built without debug info (the Kotlin framework).
            if [ -f "$DWARF" ]; then TARGETS="$DWARF $TARGETS"; fi
          fi
          for target in $TARGETS; do
            echo "== $(dwarfdump --uuid "$target")"
            for offset in $OFFSETS; do
              case "$offset" in
                ''|*[!0-9]*) echo "skipping '$offset' (expected a decimal imageOffset)"; continue ;;
              esac
              address="$(printf '0x%x' $((0x100000000 + offset)))"
              echo "$offset  $(atos -arch arm64 -o "$target" -l 0x100000000 "$address")"
            done
          done
